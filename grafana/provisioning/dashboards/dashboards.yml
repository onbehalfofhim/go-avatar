apiVersion: 1

providers:
  - name: GophProfile
    orgId: 1
    folder: GophProfile
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false